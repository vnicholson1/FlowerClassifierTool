<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supported Classes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        .container {
            max-width: 400px;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        th {
            background-color: #f2f2f2;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a {
            margin: 0 10px;
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>
    <nav>
        <a href="/">Home</a>
        <a href="/upload">Upload Training Data</a>
        <a href="/validate">Validate Data</a>
        <a href="/classes">Supported Classes</a>
    </nav>
    <div class="container">
        <h2>Supported Flower Classes</h2>
        <table>
            <tr>
                <th>Class Name</th>
                <th>Count</th>
            </tr>
            {% for class_name, count in class_counts.items() %}
            <tr>
                <td><a href="/class/{{ class_name }}">{{ class_name }}</a></td>
                <td>{{ count }}</td>
            </tr>
            {% endfor %}
        </table>
        <h2> Run Training </h2>
        <form action="/run_training" method="POST" enctype="multipart/form-data">
            <button type="submit">Training</button>
        </form>
        {% if status %}
        <p> {{ status }}</p>
        {% endif %}
    </div>
</body>

</html>
