<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validate Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        .container {
            max-width: 400px;
            margin: auto;
        }

        img {
            max-width: 100%;
            height: auto;
            margin-top: 10px;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a {
            margin: 0 10px;
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>
    <nav>
        <a href="/">Home</a>
        <a href="/upload">Upload Training Data</a>
        <a href="/validate">Validate Data</a>
        <a href="/classes">Supported Classes</a>
    </nav>
    <div class="container">
        <h2>Validate Training Data</h2>

        {% if status %}
        <p>{{ status }}</p>
        {% endif %}

        {% for class_name, base_64_and_paths in existing_images.items() %}
        <div>
            {% for base_64_and_path in base_64_and_paths %}
            <img src="{{ base_64_and_path[0] }}" alt="Flower Image">
            <p>Class: <strong>{{ class_name }}</strong></p>
            <form action="/submit_training" method="POST">
                <button type="submit" name="approve_button">Approve</button>
                <button type="submit" name="reject_button">Reject</button>
                <input type="hidden" id="class_name" name="class_name" value="{{ class_name }}">
                <input type="hidden" id="filepath" name="filepath" value="{{ base_64_and_path[1] }}">
            </form>
            {% endfor %}
        </div>
        {% endfor %}
    </div>

</body>

</html>
