<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Classifier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        .container {
            max-width: 400px;
            margin: auto;
        }

        img {
            max-width: 100%;
            height: auto;
            margin-top: 10px;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a {
            margin: 0 10px;
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>
    <nav>
        <a href="/">Home</a>
        <a href="/upload">Upload Training Data</a>
        <a href="/validate">Validate Data</a>
        <a href="/classes">Supported Classes</a>
    </nav>

    <div class="container">
        <h2>Flower Classifier</h2>
        <p>Upload an image to classify a flower.</p>
        <input type="file" id="fileInput" accept="image/*">
        <img id="preview" src="" alt="" style="display:none;">
        <h3>Top Predictions</h3>
        <ul id="predictions"></ul>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    document.getElementById('preview').src = e.target.result;
                    document.getElementById('preview').style.display = 'block';
                };
                reader.readAsDataURL(file);

                // Simulated Predictions
                document.getElementById('predictions').innerHTML = `
                    <li>Rose (90%)</li>
                    <li>Tulip (75%)</li>
                    <li>Sunflower (60%)</li>
                    <li>Daisy (45%)</li>
                    <li>Orchid (30%)</li>
                `;
            }
        });
    </script>
</body>

</html>
